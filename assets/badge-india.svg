<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 44 34" width="44" height="34" fill="none">
  <defs>
    <linearGradient id="sunsetGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#f97316" />
      <stop offset="55%" stop-color="#fb923c" />
      <stop offset="100%" stop-color="#f43f5e" />
    </linearGradient>
    <radialGradient id="sunGlow" cx="50%" cy="40%" r="50%">
      <stop offset="0%" stop-color="#fef08a" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#fef08a" stop-opacity="0" />
    </radialGradient>
    <clipPath id="squircleClipIndia">
      <rect width="44" height="34" rx="9" ry="9" />
    </clipPath>
  </defs>
  <g clip-path="url(#squircleClipIndia)">
    <!-- Golden sunset sky -->
    <rect width="44" height="34" fill="url(#sunsetGrad)" />
    <!-- Sun -->
    <circle cx="22" cy="16" r="10" fill="url(#sunGlow)" />
    <!-- Iconic Indian Architectural Silhouette (Taj Mahal / Heritage Landmark at Sunset) -->
    <!-- Base podium -->
    <rect x="6" y="27" width="32" height="7" fill="#180e29" />
    <!-- Center Dome & Arch -->
    <path d="M16 27 V19 C16 19 18 14 22 14 C26 14 28 19 28 19 V27 Z" fill="#180e29" />
    <!-- Dome top finial -->
    <line x1="22" y1="11" x2="22" y2="14" stroke="#180e29" stroke-width="1.2" stroke-linecap="round" />
    <!-- Side cupolas -->
    <path d="M13 27 V22 C13 22 14 20 15.5 20 C17 20 18 22 18 22 V27 Z" fill="#180e29" />
    <path d="M26 27 V22 C26 22 27 20 28.5 20 C30 20 31 22 31 22 V27 Z" fill="#180e29" />
    <!-- Left minaret tower -->
    <rect x="7.5" y="16" width="2" height="11" fill="#180e29" />
    <ellipse cx="8.5" cy="15.5" rx="1.6" ry="1.2" fill="#180e29" />
    <!-- Right minaret tower -->
    <rect x="34.5" y="16" width="2" height="11" fill="#180e29" />
    <ellipse cx="35.5" cy="15.5" rx="1.6" ry="1.2" fill="#180e29" />
    <!-- Grand arch cutout -->
    <path d="M19 27 V23 C19 21.5 20.3 20.5 22 20.5 C23.7 20.5 25 21.5 25 23 V27 Z" fill="#f97316" opacity="0.8" />
  </g>
</svg>